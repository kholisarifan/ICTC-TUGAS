<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — ICTC Tugas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">IC</div>
      <div>
        <div class="name">ICTC — Sistem Tugas</div>
        <div class="sub">SMAN 1 Taman</div>
      </div>
    </div>

    <h1>Masuk</h1>
    <p>Masuk pakai akun ICTC kamu untuk melihat tugas dan progres.</p>

    <div class="form-error" id="err"></div>

    <form id="form-login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="nama@contoh.com">
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Masuk</button>
    </form>

    <div class="auth-foot">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
